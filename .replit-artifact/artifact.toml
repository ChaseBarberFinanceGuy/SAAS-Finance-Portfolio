kind = "api"
previewPath = "/"
title = "Stratum Streamlit Backend"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8501
name = "Stratum Streamlit App"
paths = ["/"]

[services.development]
run = "python -m streamlit run app/Home.py --server.address=0.0.0.0 --server.port=\"${PORT:-8501}\" --server.headless=true"

[services.production.run]
args = ["bash", "-lc", "python -m streamlit run app/Home.py --server.address 0.0.0.0 --server.port \"${PORT:-8501}\" --server.headless=true"]

[services.production.health.startup]
path = "/"
